<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: #eef1f6; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; color: #1f2738; }
  #root { min-height: 100vh; }
  ::-webkit-scrollbar { height: 11px; width: 11px; }
  ::-webkit-scrollbar-thumb { background: #cfd6e2; border-radius: 99px; border: 3px solid #eef1f6; }
  ::-webkit-scrollbar-thumb:hover { background: #b5bfd0; }
  ::-webkit-scrollbar-track { background: transparent; }
  .matrix-seg:hover { transform: scale(1.06); }
  @media (prefers-reduced-motion: no-preference) {
    .drawer-enter { animation: drawerIn .2s ease both; }
  }
  @keyframes drawerIn { from { transform: translateX(22px); } to { transform: translateX(0); } }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #1d4ed8; outline-offset: 1px; }
  select, input { outline: none; }
  .matriz-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a93a4; font-size: 14px; }
</style>
